[package]
name = "counter"
version = "0.1.0"
edition = "2021"
description = "Minimal counter contract with IBC destination callback for the ZIGChain callbacks tutorial"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true

[features]
library = []

[dependencies]
# ZIGChain v5 runs wasmd / wasmvm with CosmWasm 2.x VM.
# The `cosmwasm_3_0` capability is not available on-chain, so we target 2.2
# and parse the ICS-20 packet data ourselves (no `cb.transfer` convenience).
cosmwasm-schema = "2.2"
cosmwasm-std = { version = "2.2", features = ["cosmwasm_2_2", "stargate"] }
cw-storage-plus = "2.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"
